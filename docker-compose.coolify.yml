# DeskcommCRM no Coolify — uma instalação por recurso/cliente.
#
# No Coolify, escolha o Build Pack "Docker Compose" e informe este arquivo.
# Configure o domínio no serviço `app` como https://crm.cliente.com:3000.
# O :3000 indica a porta INTERNA; visitantes continuam usando HTTPS normal.
#
# Não acrescente Caddy, `ports: 80:80`/`443:443` nem labels Traefik aqui.
# O Coolify cria a rede do recurso, conecta o proxy e gera as rotas/TLS.
#
# As imagens são intencionalmente versionadas nas variáveis do Coolify. O
# deploy de um cliente não pode compilar uma cópia diferente do produto nem
# trocar de versão sozinho quando uma tag móvel muda.

x-runtime-env: &runtime-env
  env_file:
    - .env

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  app:
    mem_limit: 768m
    image: ${APP_IMAGE:?Defina APP_IMAGE com uma tag de release}
    pull_policy: ${APP_PULL_POLICY:-missing}
    restart: unless-stopped
    <<: *runtime-env
    environment:
      # A URL administrativa existe apenas no host de manutenção. Nunca entra
      # no processo público do Next.js.
      SUPABASE_DB_ADMIN_URL: ""
    depends_on:
      srh:
        condition: service_started
      waha:
        condition: service_started
    healthcheck:
      test: ["CMD", "node", "-e", "require('net').connect(3000,'127.0.0.1').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s
    logging: *default-logging

  worker:
    mem_limit: 512m
    image: ${WORKER_IMAGE:?Defina WORKER_IMAGE na mesma release do APP_IMAGE}
    pull_policy: ${WORKER_PULL_POLICY:-missing}
    restart: unless-stopped
    <<: *runtime-env
    environment:
      WAHA_API_BASE_URL: http://waha:3000
      SUPABASE_DB_ADMIN_URL: ""
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8787/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging: *default-logging

  waha:
    mem_limit: 1280m
    image: ${WAHA_IMAGE:-devlikeapro/waha:latest-2026.7.2}
    restart: unless-stopped
    environment:
      WAHA_API_KEY: "sha512:${WAHA_API_KEY_SHA512:?Defina WAHA_API_KEY_SHA512}"
      WHATSAPP_HOOK_URL: ${WAHA_WEBHOOK_BASE_URL:?Defina WAHA_WEBHOOK_BASE_URL}/api/v1/webhooks/waha
      WHATSAPP_HOOK_EVENTS: "message.any,message.ack,message.edited,message.revoked,session.status,state.change"
      WHATSAPP_HOOK_HMAC: ${WAHA_HMAC_SECRET:?Defina WAHA_HMAC_SECRET}
      WHATSAPP_DEFAULT_ENGINE: ${WHATSAPP_DEFAULT_ENGINE:-NOWEB}
      WAHA_DASHBOARD_ENABLED: "false"
      WHATSAPP_RESTART_ALL_SESSIONS: "${WHATSAPP_RESTART_ALL_SESSIONS:-True}"
    volumes:
      - waha-data:/app/.sessions
      - waha-media:/app/.media
    logging: *default-logging

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 3s
      retries: 3
    logging: *default-logging

  srh:
    image: hiett/serverless-redis-http@sha256:5b0bb9239fce53abf87b2018a7a0deb9ec7bd900c5360738fe5fbeeb426f9150
    restart: unless-stopped
    environment:
      SRH_MODE: env
      SRH_TOKEN: ${SRH_TOKEN:?Defina SRH_TOKEN}
      SRH_CONNECTION_STRING: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    logging: *default-logging

  scheduler:
    image: ${SCHEDULER_IMAGE:?Defina SCHEDULER_IMAGE na mesma release do APP_IMAGE}
    pull_policy: ${SCHEDULER_PULL_POLICY:-missing}
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      TZ: ${TZ:-UTC}
      INTERNAL_SECRET: ${INTERNAL_SECRET:?Defina INTERNAL_SECRET}
    logging: *default-logging

volumes:
  waha-data:
  waha-media:
